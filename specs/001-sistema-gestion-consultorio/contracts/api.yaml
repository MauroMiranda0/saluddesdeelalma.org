openapi: 3.1.0
info:
  title: Salud desde el Alma API
  version: 0.1.0
  description: >-
    Contrato inicial para panel administrativo, agenda, pagos y webhook de WhatsApp
    del MVP de Salud desde el Alma.
servers:
  - url: https://api.saluddesdeelalma.org
    description: Produccion
  - url: http://localhost:4000
    description: Desarrollo local
tags:
  - name: Auth
  - name: Admin Therapists
  - name: Admin Patients
  - name: Appointments
  - name: Payments
  - name: Directory
  - name: WhatsApp
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sda_admin_session
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
    AdminSession:
      type: object
      required: [user, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        expiresAt:
          type: string
          format: date-time
    AdminUser:
      type: object
      required: [id, username, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          const: admin
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [admin]
    Patient:
      type: object
      required: [id, fullName, whatsappPhone, birthdate]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        whatsappPhone:
          type: string
        birthdate:
          type: string
          format: date
        preferredModality:
          type: string
          enum: [online, presencial]
        assignedTherapistId:
          type: string
          format: uuid
          nullable: true
    Therapist:
      type: object
      required: [id, fullName, isActive]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        isActive:
          type: boolean
    AdminTherapist:
      type: object
      required: [id, fullName, email, phone, isActive]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: ^\\+?[0-9]{8,30}$
        isActive:
          type: boolean
    CreateAdminTherapistRequest:
      type: object
      required: [fullName, phone]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          pattern: ^\\+?[0-9]{8,30}$
        email:
          type: string
          format: email
    UpdateAdminTherapistRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean
    AdminPatient:
      type: object
      required:
        [
          id,
          fullName,
          whatsappPhone,
          status,
          birthdate,
          preferredModality,
          email,
          assignedTherapistId
        ]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        whatsappPhone:
          type: string
        status:
          type: string
          enum: [activo, inactivo]
        birthdate:
          type: string
          format: date-time
        preferredModality:
          type: string
          enum: [online, presencial]
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        assignedTherapistId:
          type: string
          format: uuid
          nullable: true
    CreateAdminPatientRequest:
      type: object
      additionalProperties: false
      required: [fullName, whatsappPhone, birthdate]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        whatsappPhone:
          type: string
          minLength: 8
          maxLength: 30
        birthdate:
          type: string
          format: date
        preferredModality:
          type: string
          enum: [online, presencial]
        email:
          type: string
          format: email
        therapistId:
          type: string
          format: uuid
    AdminPatientSummary:
      type: object
      required: [id, fullName, whatsappPhone, status, assignedTherapistId]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        whatsappPhone:
          type: string
        status:
          type: string
          enum: [activo, inactivo]
        assignedTherapistId:
          type: string
          format: uuid
          nullable: true
    AssignAdminPatientTherapistRequest:
      type: object
      required: [therapistId]
      properties:
        therapistId:
          type: string
          format: uuid
          nullable: true
    UpdateAdminPatientStatusRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean
    Appointment:
      type: object
      required:
        [
          id,
          scheduledAt,
          endsAt,
          therapyType,
          durationMinutes,
          modality,
          status,
          isManualException,
          locationLabel,
          meetingLink,
          cancelReason,
          cancelledAt,
          cancellationNotice,
          createdVia,
          paymentStatus,
          payments,
          patientId,
          patientName,
          patientPhone,
          patientBirthdate,
          therapistId,
          therapistName,
          therapistIsActive
        ]
      properties:
        id:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        therapyType:
          type: string
          enum: [individual, pareja, familiar]
        durationMinutes:
          type: integer
          enum: [60, 90]
        modality:
          type: string
          enum: [online, presencial]
        status:
          type: string
          enum: [programada, confirmada, completada, cancelada]
        createdVia:
          type: string
          enum: [whatsapp, panel, system]
        isManualException:
          type: boolean
        locationLabel:
          type: string
          nullable: true
        meetingLink:
          type: string
          format: uri
          nullable: true
        cancelReason:
          type: string
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancellationNotice:
          type: string
          enum: [a_tiempo, tardia]
          nullable: true
        paymentStatus:
          type: string
          enum: [pendiente, anticipo, completado]
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        patientId:
          type: string
          format: uuid
        patientName:
          type: string
        patientPhone:
          type: string
        patientBirthdate:
          type: string
          format: date
          nullable: true
        therapistId:
          type: string
          format: uuid
          nullable: true
        therapistName:
          type: string
          nullable: true
        therapistIsActive:
          type: boolean
    Payment:
      type: object
      required:
        [
          id,
          paymentType,
          amount,
          method,
          status,
          proofReference,
          paidAt,
          createdAt
        ]
      properties:
        id:
          type: string
          format: uuid
        paymentType:
          type: string
          enum: [anticipo, completo]
        amount:
          type: number
          format: float
        method:
          type: string
          enum: [transferencia, efectivo]
        status:
          type: string
          enum: [pendiente_validacion, validado, rechazado]
        proofReference:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    SessionRate:
      type: object
      required: [therapyType, amount]
      properties:
        therapyType:
          type: string
          enum: [individual, pareja, familiar]
        amount:
          type: number
          format: float
    PaymentProof:
      type: object
      required:
        [
          id,
          reference,
          mediaType,
          receivedAt,
          status,
          appointmentId,
          paymentId,
          associatedAt
        ]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        mediaType:
          type: string
        receivedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pendiente_asociacion, asociado]
        appointmentId:
          type: string
          format: uuid
          nullable: true
        paymentId:
          type: string
          format: uuid
          nullable: true
        associatedAt:
          type: string
          format: date-time
          nullable: true
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesion administrativa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  const: admin
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login exitoso; establece cookie `sda_admin_session`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Credenciales invalidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La identidad no es la cuenta administrativa `admin`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Cierra la sesion actual
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Sesion revocada
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Devuelve la sesion administrativa activa
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Sesion activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Sesion inexistente o expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/therapists:
    get:
      tags: [Admin Therapists]
      summary: Lista perfiles clinicos para el panel administrativo
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Perfiles clinicos ordenados por fecha de creacion ascendente
          content:
            application/json:
              schema:
                type: object
                required: [therapists]
                properties:
                  therapists:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminTherapist"
        "401":
          description: Sesion administrativa ausente, invalida o expirada (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesion no corresponde a la identidad administrativa `admin` (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Admin Therapists]
      summary: Crea un perfil clinico sin capacidad de inicio de sesion
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminTherapistRequest"
      responses:
        "201":
          description: Perfil clinico creado
          content:
            application/json:
              schema:
                type: object
                required: [therapistProfile]
                properties:
                  therapistProfile:
                    $ref: "#/components/schemas/AdminTherapist"
        "400":
          description: Datos del perfil invalidos (`validation_error`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sesion administrativa ausente, invalida o expirada (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesion no corresponde a la identidad administrativa `admin` (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El correo ya esta en uso (`email_already_in_use`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/therapists/{therapistId}:
    patch:
      tags: [Admin Therapists]
      summary: Activa o desactiva un perfil clinico
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: therapistId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminTherapistRequest"
      responses:
        "200":
          description: Perfil clinico actualizado
          content:
            application/json:
              schema:
                type: object
                required: [therapistProfile]
                properties:
                  therapistProfile:
                    $ref: "#/components/schemas/AdminTherapist"
        "400":
          description: Identificador o estado invalido, o el perfil ya tiene ese estado (`validation_error` o `no_change`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sesion administrativa ausente, invalida o expirada (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesion no corresponde a la identidad administrativa `admin` (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El perfil clinico no existe (`not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/patients:
    get:
      tags: [Admin Patients]
      summary: Lista pacientes para el panel administrativo
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Pacientes ordenados por fecha de creacion ascendente
          content:
            application/json:
              schema:
                type: object
                required: [patients]
                properties:
                  patients:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminPatient"
        "401":
          description: Sesion administrativa ausente, invalida o expirada (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesion no corresponde a la identidad administrativa `admin` (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Admin Patients]
      summary: Crea un paciente y opcionalmente le asigna un terapeuta activo
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminPatientRequest"
      responses:
        "201":
          description: Paciente creado
          content:
            application/json:
              schema:
                type: object
                required: [patient]
                properties:
                  patient:
                    $ref: "#/components/schemas/AdminPatientSummary"
        "400":
          description: Datos invalidos o terapeuta inactivo (`validation_error` o `inactive_therapist`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sesion administrativa ausente, invalida o expirada (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesion no corresponde a la identidad administrativa `admin` (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El terapeuta indicado no existe (`not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe un paciente con ese telefono de WhatsApp (`patient_already_exists`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/patients/{patientId}:
    patch:
      tags: [Admin Patients]
      summary: Activa o desactiva un paciente
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminPatientStatusRequest"
      responses:
        "200":
          description: Estado del paciente actualizado
          content:
            application/json:
              schema:
                type: object
                required: [patient]
                properties:
                  patient:
                    $ref: "#/components/schemas/AdminPatientSummary"
        "400":
          description: Identificador o estado invalido, o el paciente ya tiene ese estado (`validation_error` o `no_change`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sesion administrativa ausente, invalida o expirada (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesion no corresponde a la identidad administrativa `admin` (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El paciente no existe (`not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/patients/{patientId}/therapist:
    patch:
      tags: [Admin Patients]
      summary: Asigna o desasigna el terapeuta de un paciente
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignAdminPatientTherapistRequest"
      responses:
        "200":
          description: Asignacion de terapeuta actualizada; use `null` para desasignar
          content:
            application/json:
              schema:
                type: object
                required: [patient]
                properties:
                  patient:
                    $ref: "#/components/schemas/AdminPatientSummary"
        "400":
          description: Identificador o asignacion invalida, o el terapeuta esta inactivo (`validation_error` o `inactive_therapist`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sesion administrativa ausente, invalida o expirada (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesion no corresponde a la identidad administrativa `admin` (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El paciente o terapeuta indicado no existe (`not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/appointments:
    get:
      tags: [Appointments]
      summary: Lista citas en un rango ISO (solo cuenta `admin`)
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Citas del calendario en el rango solicitado
          content:
            application/json:
              schema:
                type: object
                required: [appointments]
                properties:
                  appointments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Appointment"
    post:
      tags: [Appointments]
      summary: Crea una cita desde el panel
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledAt, modality, therapyType]
              anyOf:
                - required: [patientId]
                - required: [patient]
              properties:
                patientId:
                  type: string
                  format: uuid
                patient:
                  type: object
                  required: [fullName, whatsappPhone, birthdate]
                  properties:
                    fullName:
                      type: string
                    whatsappPhone:
                      type: string
                    birthdate:
                      type: string
                      format: date
                    preferredModality:
                      type: string
                      enum: [online, presencial]
                    email:
                      type: string
                      format: email
                scheduledAt:
                  type: string
                  format: date-time
                modality:
                  type: string
                  enum: [online, presencial]
                therapyType:
                  type: string
                  enum: [individual, pareja, familiar]
                manualExceptionConfirmed:
                  type: boolean
                  default: false
                isManualException:
                  type: boolean
                  default: false
                locationLabel:
                  type: string
                  maxLength: 255
                meetingLink:
                  type: string
                  format: uri
      responses:
        "201":
          description: Cita creada
          content:
            application/json:
              schema:
                type: object
                required: [appointment]
                properties:
                  appointment:
                    $ref: "#/components/schemas/Appointment"
        "409":
          description: El intervalo solicitado se traslapa con una cita activa de la psicóloga asignada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/appointments/{appointmentId}:
    patch:
      tags: [Appointments]
      summary: Reagenda una cita
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: appointmentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledAt]
              properties:
                scheduledAt:
                  type: string
                  format: date-time
                modality:
                  type: string
                  enum: [online, presencial]
                therapyType:
                  type: string
                  enum: [individual, pareja, familiar]
      responses:
        "200":
          description: Cita reagendada
          content:
            application/json:
              schema:
                type: object
                required: [appointment]
                properties:
                  appointment:
                    $ref: "#/components/schemas/Appointment"
  /api/v1/appointments/{appointmentId}/confirm:
    post:
      tags: [Appointments]
      summary: Confirma una cita programada y despacha su confirmacion
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: appointmentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cita confirmada
          content:
            application/json:
              schema:
                type: object
                required: [appointment]
                properties:
                  appointment:
                    $ref: "#/components/schemas/Appointment"
        "409":
          description: La cita no esta programada o no puede confirmarse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/appointments/{appointmentId}/cancel:
    post:
      tags: [Appointments]
      summary: Cancela una cita y programa la notificacion al paciente
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: appointmentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Cita cancelada
          content:
            application/json:
              schema:
                type: object
                required: [appointment]
                properties:
                  appointment:
                    $ref: "#/components/schemas/Appointment"
  /api/v1/payments:
    post:
      tags: [Payments]
      summary: Registra un anticipo o pago completo
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointmentId, patientId, paymentType, amount, method]
              properties:
                appointmentId:
                  type: string
                  format: uuid
                patientId:
                  type: string
                  format: uuid
                paymentType:
                  type: string
                  enum: [anticipo, completo]
                amount:
                  type: number
                  format: float
                method:
                  type: string
                  enum: [transferencia, efectivo]
                proofReference:
                  type: string
      responses:
        "201":
          description: Pago registrado
          content:
            application/json:
              schema:
                type: object
                required: [payment]
                properties:
                  payment:
                    $ref: "#/components/schemas/Payment"
  /api/v1/payments/{paymentId}/confirm:
    post:
      tags: [Payments]
      summary: Confirma manualmente un pago registrado
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: paymentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pago confirmado
          content:
            application/json:
              schema:
                type: object
                required: [payment]
                properties:
                  payment:
                    $ref: "#/components/schemas/Payment"
        "409":
          description: El pago no puede confirmarse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/appointments/{appointmentId}/payment-reminder:
    post:
      tags: [Payments]
      summary: Envia un recordatorio manual de pago al paciente
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: appointmentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Recordatorio enviado
        "409":
          description: Una cita cancelada no puede recibir recordatorios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/session-rates:
    get:
      tags: [Payments]
      summary: Lista las tarifas configuradas por tipo de terapia
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Tarifas de sesion
          content:
            application/json:
              schema:
                type: object
                required: [sessionRates]
                properties:
                  sessionRates:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionRate"
  /api/v1/session-rates/{therapyType}:
    put:
      tags: [Payments]
      summary: Crea o actualiza la tarifa de un tipo de terapia
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: therapyType
          required: true
          schema:
            type: string
            enum: [individual, pareja, familiar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  format: float
                  exclusiveMinimum: 0
                  maximum: 9999999.99
      responses:
        "200":
          description: Tarifa de sesion guardada
          content:
            application/json:
              schema:
                type: object
                required: [sessionRate]
                properties:
                  sessionRate:
                    $ref: "#/components/schemas/SessionRate"
  /api/v1/payment-proofs:
    get:
      tags: [Payments]
      summary: Lista comprobantes de pago recibidos por WhatsApp
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Comprobantes ordenados por fecha de recepcion descendente
          content:
            application/json:
              schema:
                type: object
                required: [paymentProofs]
                properties:
                  paymentProofs:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentProof"
  /api/v1/payment-proofs/{proofId}/associate:
    post:
      tags: [Payments]
      summary: Asocia un comprobante pendiente a una cita y opcionalmente a un pago
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: proofId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointmentId]
              properties:
                appointmentId:
                  type: string
                  format: uuid
                paymentId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Comprobante asociado
          content:
            application/json:
              schema:
                type: object
                required: [paymentProof]
                properties:
                  paymentProof:
                    $ref: "#/components/schemas/PaymentProof"
        "409":
          description: El comprobante no puede asociarse a la cita o pago indicados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/appointments/{appointmentId}/complete:
    post:
      tags: [Appointments]
      summary: Completa una cita iniciada y programa el aviso de saldo si aplica
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: appointmentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cita completada
          content:
            application/json:
              schema:
                type: object
                required: [appointment]
                properties:
                  appointment:
                    type: object
                    required: [id, status, completedAt]
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        const: completada
                      completedAt:
                        type: string
                        format: date-time
                        nullable: true
  /api/v1/directory:
    get:
      tags: [Directory]
      summary: Lista perfiles de psicólogos/as y pacientes para visualización administrativa
      description: Solo la cuenta autenticada `admin` con rol `admin` puede consultar este recurso. Los perfiles devueltos no obtienen capacidad de login.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Directorio operativo con resumen de citas y pagos pendientes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, fullName, role]
                      properties:
                        id:
                          type: string
                          format: uuid
                        fullName:
                          type: string
                        role:
                          type: string
                          enum: [psicologo, paciente]
                        pendingPaymentsCount:
                          type: integer
                          minimum: 0
  /api/v1/webhooks/whatsapp:
    get:
      tags: [WhatsApp]
      summary: Verificacion del webhook de Meta
      parameters:
        - in: query
          name: hub.mode
          required: true
          schema:
            type: string
        - in: query
          name: hub.verify_token
          required: true
          schema:
            type: string
        - in: query
          name: hub.challenge
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge devuelto
          content:
            text/plain:
              schema:
                type: string
    post:
      tags: [WhatsApp]
      summary: Recibe eventos de mensajes y estados desde WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry]
              properties:
                entry:
                  type: array
                  items:
                    type: object
      responses:
        "202":
          description: Evento aceptado para procesamiento asincrono
